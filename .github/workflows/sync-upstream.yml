name: sync-upstream

on:
  schedule:
    - cron: '17 0 */3 * *'   # every 3 days (days 1, 4, 7, …), 00:17 UTC (off-minute avoids the busiest slot)
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs (cron + manual) from racing on push
concurrency: sync-upstream

env:
  UPSTREAM: https://github.com/Leonxlnx/taste-skill.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap exit: nothing below runs when upstream HEAD is already mirrored.
      - name: Check upstream HEAD
        id: check
        run: |
          remote=$(git ls-remote "$UPSTREAM" HEAD | cut -f1)
          if [ "$remote" = "$(cat UPSTREAM_SHA)" ]; then
            echo "Upstream unchanged at ${remote:0:7}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Fetch upstream
        if: steps.check.outputs.changed == 'true'
        run: git clone --depth 1 "$UPSTREAM" /tmp/up

      # Upstream's own checks run first: a broken upstream commit fails the job
      # instead of landing in this repo.
      - name: Validate upstream
        if: steps.check.outputs.changed == 'true'
        working-directory: /tmp/up
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
          find skills -type f \( -name '*.mjs' -o -name '*.js' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Mirror
        if: steps.check.outputs.changed == 'true'
        run: node .github/scripts/mirror.mjs /tmp/up

      # Same validator Claude Code runs when adding a marketplace.
      # Installed once so the two validations don't each resolve the package.
      - name: Validate mirror
        if: steps.check.outputs.changed == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.304
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

      - name: Commit & push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name sync-bot
          git config user.email sync-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "sync upstream @ $(cut -c1-7 UPSTREAM_SHA)"
          git push
