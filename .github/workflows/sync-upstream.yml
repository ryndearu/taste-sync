name: sync-upstream

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs (cron + manual) from racing on push
concurrency: sync-upstream

env:
  UPSTREAM: https://github.com/Leonxlnx/taste-skill.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch upstream
        run: git clone --depth 1 "$UPSTREAM" /tmp/up

      # Upstream's own checks run first: a broken upstream commit fails the job
      # instead of landing in this repo.
      - name: Validate upstream
        working-directory: /tmp/up
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
          find skills -type f \( -name '*.mjs' -o -name '*.js' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Mirror
        run: node .github/scripts/mirror.mjs /tmp/up

      # Same validator Claude Code runs when adding a marketplace
      - name: Validate mirror
        run: |
          npx -y @anthropic-ai/claude-code@2.1.304 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.304 plugin validate .claude-plugin/plugin.json

      - name: Commit & push
        run: |
          git config user.name sync-bot
          git config user.email sync-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "sync upstream @ $(cut -c1-7 UPSTREAM_SHA)"
          git push
